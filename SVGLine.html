<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SVG Curve</title>

    <style>
        body {
            background: black;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        svg {
            border: 1px solid red;
        }

        #result {
            color: white;
        }
    </style>
</head>

<body>

    <svg width="1000" height="200">
        <path id="curve" d="M 10 100 Q 500 100 990 100" stroke="white" fill="transparent" stroke-width="2" />
    </svg>

    <p id="result"></p>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>

    <script>

        var svg = document.querySelector("svg");
        var path = document.querySelector("#curve");
        var result = document.querySelector("#result");

        var finalPath = `M 10 100 Q 500 100 990 100`;

        svg.addEventListener("mousemove", function (e) {

            let x = e.offsetX;
            let y = e.offsetY;

            let pathData = `M 10 100 Q ${x} ${y} 990 100`;

            result.innerHTML = x + " " + y;

            gsap.to(path, {
                attr: { d: pathData },
                duration: 0.2
            });

        });

        svg.addEventListener("mouseleave", function () {

            gsap.to(path, {
                attr: { d: finalPath },
                duration: 1,
                ease: "elastic.out(1,0.3)"
            });

        });

    </script>

</body>

</html>
