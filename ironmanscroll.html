<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Man Scroll</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            /* Height matches the ScrollTrigger end value so rotation
               completes exactly when the user hits the bottom */
            height: 300vh;
        }

        /* Fixed scene layer — sits behind content via z-index, NOT z-index:-1
           so stacking contexts work correctly with overlay text */
        #scene {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }

        /* Content layer — positioned on top of the 3D scene */
        .content {
            position: relative;
            z-index: 1;
            pointer-events: none;
            /* let scroll pass through to body */
        }

        .hero {
            height: 100vh;
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            padding: 0 6vw 8vh;
        }

        .hero h1 {
            font-family: 'Courier New', monospace;
            font-size: clamp(2rem, 6vw, 5rem);
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .hero h1 span {
            display: block;
            color: rgba(200, 60, 30, 0.9);
        }

        .scroll-hint {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 2;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            writing-mode: vertical-rl;
            transition: opacity 0.5s;
        }

        .scroll-hint.hidden {
            opacity: 0;
        }
    </style>
</head>

<body>

    <!-- Fixed 3D scene layer -->
    <div id="scene">
        <model-viewer id="model" src="iron_man.glb" camera-orbit="0deg 85deg 3.5m" disable-zoom
            interaction-prompt="none"></model-viewer>
    </div>

    <!-- Scrollable content layer on top -->
    <div class="content">
        <section class="hero">
            <h1>Iron<span>Man</span></h1>
        </section>
    </div>

    <!-- Scroll indicator -->
    <div class="scroll-hint" id="scrollHint">Scroll</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        const model = document.getElementById("model");
        const scrollHint = document.getElementById("scrollHint");

        // Wait for model to load before animating
        model.addEventListener("load", () => {

            ScrollTrigger.create({
                trigger: "body",
                start: "top top",

                end: "bottom bottom",
                scrub: 0.5,
                onUpdate: (self) => {
                    const angle = self.progress * 360;

                    const zoom = 2.5 + self.progress * 1.2;
                    model.cameraOrbit = `${angle}deg 75deg ${zoom.toFixed(2)}m`;
                },
                onLeave: () => {
                    scrollHint.classList.add("hidden");
                }
            });

            // Hide scroll hint once user starts scrolling
            ScrollTrigger.create({
                trigger: "body",
                start: "top-=1 top",
                onEnter: () => scrollHint.classList.add("hidden"),
                onLeaveBack: () => scrollHint.classList.remove("hidden")
            });
        });
    </script>
</body>

</html>
